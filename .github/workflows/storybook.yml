name: Storybook

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storybook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Components, accessibility, and static site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Keep the existing warning baseline; additional warnings fail this check.
      - run: npm run lint -- --max-warnings=19
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:storybook
      - run: npm run build-storybook
        env:
          STORYBOOK_BASE_PATH: /react-minesweeper
      - run: npm run test:storybook:build
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: storybook-test-results
          path: test-results/
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: storybook-static

  deploy:
    name: Publish GitHub Pages
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy tested static site
        id: deployment
        uses: actions/deploy-pages@v4
